function trendSVG(series){
  const w=320, h=120, padX=10, padTop=14, padBot=18;
  const max=Math.max(...series), min=Math.min(...series);
  const rng=(max-min)||1;
  const innerW=w-2*padX, innerH=h-padTop-padBot;
  const pts=series.map((v,i)=>{
    const x=padX+innerW*i/(series.length-1);
    const y=padTop+innerH*(1-(v-min)/rng);
    return [x,y];
  });
  const line=pts.map((p,i)=>(i?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1)).join(' ');
  const area=line+` L ${padX+innerW} ${h-padBot} L ${padX} ${h-padBot} Z`;
  const dots=pts.map(p=>`<circle cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="3" fill="var(--surface-card)" stroke="var(--module-2)" stroke-width="2"/>`).join('');
  return `<svg class="trend-svg" viewBox="0 0 ${w} ${h}" preserveAspectRatio="xMidYMid meet">
    <defs><linearGradient id="tg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="var(--module-2)" stop-opacity=".28"/><stop offset="1" stop-color="var(--module-2)" stop-opacity="0"/></linearGradient></defs>
    <path d="${area}" fill="url(#tg)"/><path d="${line}" fill="none" stroke="var(--module-2)" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>${dots}</svg>`;
}

function donutSVG(segs){
  const total=segs.reduce((s,x)=>s+x.amount,0)||1;
  const r=42, c=2*Math.PI*r; let acc=0; const out=[];
  segs.forEach(s=>{
    const len=(s.amount/total)*c;
    out.push(`<circle cx="52" cy="52" r="${r}" fill="none" stroke="${s.color}" stroke-width="14"
      stroke-dasharray="${len.toFixed(2)} ${(c-len).toFixed(2)}" stroke-dashoffset="${(c-acc).toFixed(2)}" transform="rotate(-90 52 52)"/>`);
    acc+=len;
  });
  return `<svg viewBox="0 0 104 104" width="104" height="104">${out.join("")}</svg>`;
}

let calMonth=null, calItemId=null;
function renderCalendar(m, it){
  if(!it.length) return "";
  const now=new Date();
  const cm=calMonth||{y:now.getFullYear(),m:now.getMonth()};
  const item=it.find(x=>x.id===calItemId)||it[0]; calItemId=item.id;
  const y=cm.y, mo=cm.m;
  const startDow=new Date(y,mo,1).getDay();
  const days=new Date(y,mo+1,0).getDate();
  const todayIso=isoToday();
  const log=item.log||{};
  const chips=it.map(x=>`<button type="button" class="cal-chip ${x.id===item.id?'on':''}" data-calitem="${x.id}">${esc(x.title)}</button>`).join("");
  let cells="", monthCount=0;
  for(let i=0;i<startDow;i++) cells+=`<div class="cal-cell blank"></div>`;
  for(let d=1;d<=days;d++){
    const ds=`${y}-${String(mo+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const on=!!log[ds]; if(on) monthCount++;
    cells+=`<button type="button" class="cal-cell ${on?'on':''} ${ds===todayIso?'today':''}" data-date="${ds}"${on?` style="background:${m.color};border-color:${m.color}"`:''}>${d}</button>`;
  }
  return `<div class="panel cal-panel">
    <div class="cal-hd"><button class="cal-nav" data-cal="prev">${icon("chevron",16,2)}</button>
      <span class="cal-title">${y}年${mo+1}月</span>
      <button class="cal-nav" data-cal="next">${icon("chevron",16,2)}</button></div>
    <div class="cal-chips">${chips}</div>
    <div class="cal-dow">${"日一二三四五六".split("").map(x=>`<span>${x}</span>`).join("")}</div>
    <div class="cal-grid">${cells}</div>
    <div class="cal-foot">${icon("flame",13)} 连续 ${streak(log)} 天 · 本月 ${monthCount}/${days} 天</div></div>`;
}
function wireCalendar(key, it){
  const block=$("#screen").querySelector(".cal-panel"); if(!block) return;

    const now=new Date(); let y=calMonth?calMonth.y:now.getFullYear(), mo=calMonth?calMonth.m:now.getMonth();
    if(el.dataset.cal==="prev"){ mo--; if(mo<0){mo=11;y--;} }

let calToastTimer=null;
function showCalUndo(item, ds){
  let t=$("#calToast");
  if(!t){ t=document.createElement("div"); t.id="calToast"; t.className="cal-toast"; t.style.cssText="position:fixed;left:50%;bottom:80px;transform:translateX(-50%);background:var(--text);color:var(--page-bg);padding:10px 16px;border-radius:999px;z-index:70;display:flex;gap:10px;align-items:center;font-size:13px;"; document.body.appendChild(t); }
  t.innerHTML=`已取消 ${ds.slice(5)} 打卡<button id="calUndo" style="background:var(--module-2);color:#fff;border:none;border-radius:999px;padding:4px 10px;">撤销</button>`;
  const undo=$("#calUndo"); if(undo) undo.onclick=()=>{ item.log=item.log||{}; item.log[ds]=true; persist(); t.remove(); };
  clearTimeout(calToastTimer);
  calToastTimer=setTimeout(()=>{ const el=$("#calToast"); if(el) el.remove(); }, 4000);
}
function confirmCalUncheck(item, ds){
  const overlay=document.createElement("div"); overlay.className="overlay";
  overlay.innerHTML=`<div class="modal"><div class="grab"></div><h2>取消打卡</h2>
    <div class="sub">取消 ${ds} 的打卡可能会中断连续天数，确定吗？</div>
    <div class="modal-actions"><button class="btn ghost" id="cu-cancel">保留</button><button class="btn danger" id="cu-ok">取消打卡</button></div></div>`;
  document.body.appendChild(overlay);
  const close=()=>overlay.remove();
  overlay.onclick=e=>{ if(e.target===overlay) close(); };
  overlay.querySelector("#cu-cancel").onclick=close;
  overlay.querySelector("#cu-ok").onclick=()=>{ delete item.log[ds]; persist(); close(); showCalUndo(item, ds); };
}

function wireHome(){
  $("#screen").querySelectorAll("[data-open]").forEach(el=>el.onclick=()=>go(el.dataset.open));
  $("#screen").querySelectorAll("[data-module]").forEach(el=>el.onclick=()=>{ go(el.dataset.module); openEditor(el.dataset.module,null); });
  $("#screen").querySelectorAll("[data-action='fetchRss']").forEach(el=>el.onclick=()=>fetchAllRssAndSave(true));
  const find=el=>(data[el.dataset.mkey]||[]).find(i=>i.id==el.dataset.id);
  $("#screen").querySelectorAll(".js-pin-chk").forEach(el=>el.onclick=e=>{
    e.stopPropagation(); const m=modOf(el.dataset.mkey), x=find(el); if(!x) return;
    if(m.type==="todo"){ x.done=!x.done; }
    else if(m.type==="checkin"){ x.log=x.log||{}; const t=today(); x.log[t]?delete x.log[t]:x.log[t]=true; }
    persist();
  });
  $("#screen").querySelectorAll(".js-pin-inc").forEach(el=>el.onclick=e=>{ e.stopPropagation(); const x=find(el); if(!x) return; x.current=(+x.current||0)+1; persist(); });
  $("#screen").querySelectorAll(".js-pin-dec").forEach(el=>el.onclick=e=>{ e.stopPropagation(); const x=find(el); if(!x) return; x.current=Math.max(0,(+x.current||0)-1); persist(); });
  $("#screen").querySelectorAll(".js-pin-open").forEach(el=>el.onclick=()=>openEditor(el.dataset.mkey, find(el)));
}

function renderInsight(){
  const DONUT_COLORS=["var(--module-4)","var(--module-3)","var(--module-5)","var(--module-2)","var(--module-1)","var(--accent)"];
  const bars = CONFIG.modules.map(m=>{
    const it=data[m.key]||[]; let pct=0, label="";
    if(m.type==="todo"){ const d=it.filter(x=>x.done).length; pct=it.length?Math.round(d/it.length*100):0; label=`${d}/${it.length}`; }
    else if(m.type==="checkin"){ const t=today(); const d=it.filter(x=>x.log&&x.log[t]).length; pct=it.length?Math.round(d/it.length*100):0; label=`${d}/${it.length}`; }
    else if(m.type==="progress"){ pct=avgProgress(it).value; label=`${pct}%`; }
    else { label=`${it.length} 条`; }
    return {m, pct, label};
  });
  const barAvg = bars.length ? Math.round(bars.reduce((s,b)=>s+b.pct,0)/bars.length) : 0;
  const barList = bars.map(b=>`<div class="bar-row" data-open="${b.m.key}">
    <span class="bar-ic" style="color:${b.m.color}">${icon(b.m.icon,17)}</span>
    <span class="bar-name">${b.m.name}</span>
    <div class="pbar"><i style="width:${Math.min(100,b.pct)}%;background:${b.m.color}"></i></div>
    <span class="bar-pct">${b.label}</span></div>`).join("");
  const noteData = data.notes||[];
  const moodMap = {};
  noteData.forEach(n=>{ const k=n.mood||"其他"; moodMap[k]=(moodMap[k]||0)+1; });
  const segs = Object.keys(moodMap).map(k=>({cat:k,amount:moodMap[k]})).sort((a,b)=>b.amount-a.amount);
  const total = segs.reduce((s,x)=>s+x.amount,0);
  segs.forEach((s,i)=>s.color=DONUT_COLORS[i%DONUT_COLORS.length]);
  const donut = segs.length ? donutSVG(segs) : `<div class="donut-empty" style="width:68px;height:68px;display:flex;flex-direction:column;align-items:center;justify-content:center;color:var(--text-tertiary);font-size:10px;">${icon("book",22)}<span>暂无</span></div>`;
  const legend = segs.map(s=>{ const p=total?Math.round(s.amount/total*100):0;
    return `<div class="legend-item"><span class="legend-dot" style="background:${s.color}"></span>
      <span class="legend-name">${esc(s.cat)}</span><span class="legend-amt">${s.amount}条</span><span class="legend-pct">${p}%</span></div>`; }).join("");
  $("#screen").innerHTML = `<div class="greet"><div><h1>洞察</h1><p>各模块进展一览 · 记录—执行—统计—反馈</p></div></div>
    <div class="sec-title">模块完成度</div>
    <div class="panel"><div class="ph">${icon("chart",15)} 模块完成度<span class="avg">均 ${barAvg}%</span></div>
      <div class="bar-list">${barList}</div></div>
    <div class="sec-title">知识分类占比</div>
    <div class="panel"><div class="ph">${icon("book",15)} 内容记录分类<span class="avg">合计 ${total} 条</span></div>
      <div class="donut-wrap"><div class="donut">${donut}${segs.length?`<span class="donut-mid" style="position:absolute;inset:0;display:grid;place-items:center;font-size:13px;font-weight:800;">${total}条</span>`:''}</div>
        <div class="donut-legend">${legend}</div></div></div>`;
  $("#screen").querySelectorAll("[data-open]").forEach(el=>el.onclick=()=>go(el.dataset.open));
}

function renderModule(key){
  const m=modOf(key); let it=data[key]||[];
  const t=today();
  let head="", extra="";
  // 笔记模块加搜索 + 标签过滤
  let searchBar="", tagFilter="";
  if(key==="notes"){
    const mq=data.__noteQuery||"";
    const mt=data.__noteTag||"";
    searchBar=`<div class="search-bar">${icon("search",18)}<input id="note-search" value="${attr(mq)}" placeholder="搜索标题、内容、标签…"/><button class="clr" id="note-clr">${icon("close",14)}</button></div>`;
    const tags=["全部"].concat((m.moods||[]));
    tagFilter=`<div class="tag-chips">${tags.map(tg=>`<div class="tag-chip ${(tg==="全部"?!mt:mt===tg)?'on':''}" data-tag="${attr(tg)}">${tg}</div>`).join("")}</div>`;
    if(mq){ const q=mq.toLowerCase(); it=it.filter(x=> (x.title||"").toLowerCase().includes(q) || (x.content||"").toLowerCase().includes(q) || (x.subtag||"").toLowerCase().includes(q) || (x.source||"").toLowerCase().includes(q)); }
    if(mt){ it=it.filter(x=>x.mood===mt); }
  }
  if(m.type==="todo"){
    const done=it.filter(x=>x.done).length; const pct=it.length?Math.round(done/it.length*100):0;
    head=headHero(m, `${done}/${it.length}`, "今日已完成", pct);
  } else if(m.type==="checkin"){
    const done=it.filter(x=>x.log&&x.log[t]).length; const pct=it.length?Math.round(done/it.length*100):0;
    head=headHero(m, `${done}/${it.length}`, "今日已打卡", pct);
  } else if(m.type==="progress"){
    const p=avgProgress(it);
    head=headHero(m, `${p.value}%`, `平均进度 · ${it.length} 项`, p.value);
  } else {
    const todayN=it.filter(x=>x.date===t).length;
    head=headHero(m, `${it.length}`, `条记录 · 今日 ${todayN} 条`, null);
  }
  if(m.type==="checkin") extra=renderCalendar(m,it);
  const body = it.length ? it.map(x=>recHTML(m,x)).join("")
    : `<div class="empty"><span class="e">${icon(m.icon,26)}</span><div>${key==="notes"&&mq?"没有匹配的记录，换个关键词试试":"还没有记录，点上方「新建」添加第一条吧"}</div></div>`;
  $("#screen").innerHTML = `<div class="greet"><div><h1>${m.name}</h1><p>${m.desc}</p></div>
      <button class="add" id="btn-add">${icon("plus",16,2.2)}新建</button></div>
    <div style="margin-top:16px">${head}${searchBar}${tagFilter}${extra}
      <div class="sec-title">记录${key==="notes"&&mq?` · 搜索到 ${it.length} 条`:""}${key==="notes"&&!mq&&mt?` · ${mt} ${it.length} 条`:""}</div>${body}</div>`;
  wireModule(key);
  // 绑定搜索
  if(key==="notes"){
    const si=$("#note-search"); if(si) si.oninput=e=>{ data.__noteQuery=e.target.value; clearTimeout(si._t); si._t=setTimeout(()=>renderModule(key),300); };
    const ci=$("#note-clr"); if(ci) ci.onclick=()=>{ data.__noteQuery=""; data.__noteTag=""; renderModule(key); };
    document.querySelectorAll(".tag-chip").forEach(el=>el.onclick=()=>{ data.__noteTag = el.dataset.tag==="全部"?"":el.dataset.tag; renderModule(key); });
  }
}

function headHero(m, big, label, pct){
  const inner=`<div class="hero-ic" style="background:${m.tint};color:${m.color}">${icon(m.icon,20)}</div>
    <div style="flex:1;min-width:0"><div class="hero-tx" style="display:flex;align-items:baseline;gap:7px;flex-wrap:wrap;"><span class="hero-v">${big}</span><span class="hero-l">${label}</span></div>
    ${pct!=null?`<div class="hero-bar"><i style="width:${Math.min(100,pct)}%;background:${m.color}"></i></div>`:''}</div>`;
  return `<div class="hero">${inner}</div>`;
}

function recHTML(m,x){
  const pin=`<button class="pin-btn js-pin ${x.pinned?'on':''}" data-id="${x.id}">${icon("star",15)}</button>`;
  const del=`<button class="del js-del" data-id="${x.id}">${icon("trash",16)}</button>`;
  const acts=`<div class="acts">${pin}${del}</div>`;
  const chkMark=icon("check",14,2.4);
  const thumb=x.image?`<img class="thumb" src="${attr(x.image)}" alt="">`:'';
  const customMeta=(m.fields||[]).filter(f=>x[f.key]).map(f=>`<span class="meta-tag" style="font-size:12px;font-weight:600;color:var(--text-secondary);">${esc(x[f.key])}</span>`).join("");
  const customBlock=customMeta?`<div class="meta-line" style="display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-top:4px;">${customMeta}</div>`:'';
  const layout=x.layout||'default';
  const layoutCls=`rec-layout-${layout}`;
  if(layout==='feature' && x.image){
    const body=(x.content||x.note||'').trim();
    return `<div class="rec ${layoutCls}">${acts}<div class="top" data-edit="${x.id}" style="flex-direction:column">
      ${thumb}
      <div class="feat-title" style="padding:10px 12px 4px;font-size:15px;font-weight:700;">${esc(x.title||'无标题')}</div>
      ${body?`<div class="feat-body" style="padding:0 12px 12px;font-size:13px;color:var(--text-secondary);">${esc(body)}</div>`:''}
      ${customBlock?`<div style="padding:0 12px 12px">${customBlock}</div>`:''}</div></div>`;
  }
  if(layout==='quote'){
    const text=(x.content||x.title||'').trim();
    return `<div class="rec ${layoutCls}">${acts}<div class="top" data-edit="${x.id}" style="flex-direction:column;align-items:center;text-align:center">
      <div style="font-size:16px;font-weight:600;line-height:1.6;">${esc(text)}</div>
      ${x.mood?`<div style="margin-top:8px;font-size:12px;color:var(--text-tertiary);">${esc(x.mood)}${x.date?` · ${esc(x.date)}`:''}</div>`:(x.date?`<div style="margin-top:8px;font-size:12px;color:var(--text-tertiary);">${esc(x.date)}</div>`:'')}
      ${customBlock?`<div style="margin-top:8px">${customBlock}</div>`:''}</div></div>`;
  }
  if(m.type==="todo"){
    const p=(m.priorities||[]).find(p=>p.key===x.priority);
    return `<div class="rec ${layoutCls}">${acts}<div class="top">
      <div class="chk js-chk ${x.done?'on':''}" data-id="${x.id}">${chkMark}</div>
      ${thumb}
      <div class="body" data-edit="${x.id}"><div class="rname ${x.done?'done':''}">${esc(x.title)}</div>
      <div class="rmeta">${p?`<span class="badge" style="background:${p.color};color:${p.text}"><span class="dot"></span>${p.label}</span>`:''}</div>
      ${x.note?`<div class="rnote">${esc(x.note)}</div>`:''}${customBlock}</div></div></div>`;
  }
  if(m.type==="checkin"){
    const on=!!(x.log&&x.log[today()]); const st=streak(x.log);
    return `<div class="rec ${layoutCls}">${acts}<div class="top">
      <div class="chk js-chk ${on?'on':''}" data-id="${x.id}">${chkMark}</div>
      ${thumb}
      <div class="body" data-edit="${x.id}"><div class="rname">${esc(x.title)}</div>
      <div class="rmeta"><span class="streak">${icon("flame",13)} 连续 ${st} 天</span>${on?'<span class="badge" style="background:var(--accent-muted);color:var(--accent)">今日已打卡</span>':''}</div>${customBlock}</div></div></div>`;
  }
  if(m.type==="progress"){
    const pct=Math.min(100,Math.round((x.current/x.target)*100||0));
    return `<div class="rec ${layoutCls}">${acts}<div class="top">${thumb}<div class="body" data-edit="${x.id}">
      <div class="rname">${esc(x.title)}</div>
      <div class="rmeta"><span style="color:var(--text-secondary);font-size:13px;">${x.current}/${x.target} ${x.unit||m.unit||''} · ${pct}%</span></div>
      <div class="pbar"><i style="width:${pct}%;background:${m.color}"></i></div>
      ${x.note?`<div class="rnote">${esc(x.note)}</div>`:''}${customBlock}</div></div></div>`;
  }
  return `<div class="rec ${layoutCls}">${acts}<div class="top">${thumb}<div class="body" data-edit="${x.id}">
    <div class="rname">${esc(x.title||'无标题')}</div>
    <div class="rmeta">${x.mood?`<span class="badge" style="background:var(--accent-muted);color:var(--accent)">${esc(x.mood)}</span>`:''}<span style="color:var(--text-secondary);font-size:12px;">${x.date||''}</span></div>
    ${x.content?`<div class="rnote">${esc(x.content)}</div>`:''}${customBlock}</div></div></div>`;
}

function streak(log){
  if(!log) return 0; let n=0; const d=new Date();
  for(;;){ const key=d.toISOString().slice(0,10); if(log[key]){ n++; d.setDate(d.getDate()-1); } else break; }
  return n;
}

function wireModule(key){
  const m=modOf(key);
  $("#screen").querySelectorAll(".js-chk").forEach(el=>el.onclick=e=>{
    e.stopPropagation(); const x=(data[key]).find(i=>i.id==el.dataset.id);
    if(m.type==="todo"){ x.done=!x.done; }
    else if(m.type==="checkin"){ x.log=x.log||{}; const t=today(); x.log[t]?delete x.log[t]:x.log[t]=true; }
    persist();
  });
  $("#screen").querySelectorAll("[data-edit]").forEach(el=>el.onclick=()=>openEditor(key,(data[key]).find(i=>i.id==el.dataset.edit)));
  $("#screen").querySelectorAll(".js-del").forEach(el=>el.onclick=e=>{ e.stopPropagation(); confirmDelete(key, el.dataset.id); });
  $("#screen").querySelectorAll(".js-pin").forEach(el=>el.onclick=e=>{ e.stopPropagation(); const x=(data[key]).find(i=>i.id==el.dataset.id); x.pinned=!x.pinned; persist(); });
  const add=$("#btn-add"); if(add) add.onclick=()=>openEditor(key,null);
  if(m.type==="checkin") wireCalendar(key, data[key]||[]);
}

function openEditor(key, item){
  const m=modOf(key); const editing=!!item;
  const d = item || newItem(m);
  let fields="";
  if(m.type==="todo"){
    fields=`<div class="field"><label>任务</label><input id="f-title" value="${attr(d.title)}" placeholder="要做什么？"/></div>
      <div class="field"><label>优先级</label><div class="seg" id="f-prio">${(m.priorities||[]).map(p=>`<div class="opt ${p.key===d.priority?'on':''}" data-v="${p.key}">${p.label}</div>`).join("")}</div></div>
      <div class="field"><label>备注</label><textarea id="f-note" placeholder="补充说明">${esc(d.note||'')}</textarea></div>`;
  } else if(m.type==="checkin"){
    fields=`<div class="field"><label>打卡项</label><input id="f-title" value="${attr(d.title)}" placeholder="例如：学习梦幻西游知识"/></div>
      <p class="sub" style="margin:0">保存后可在列表点击左侧方块打卡；连续天数自动统计。</p>`;
  } else if(m.type==="progress"){
    fields=`<div class="field"><label>名称</label><input id="f-title" value="${attr(d.title)}" placeholder="目标名称"/></div>
      <div class="frow"><div class="field"><label>当前</label><input id="f-cur" type="number" value="${d.current??0}"/></div>
      <div class="field"><label>目标</label><input id="f-tgt" type="number" value="${d.target??1}"/></div>
      <div class="field"><label>单位</label><input id="f-unit" value="${attr(d.unit||m.unit||'')}"/></div></div>
      <div class="field"><label>备注</label><textarea id="f-note" placeholder="补充说明">${esc(d.note||'')}</textarea></div>`;
  } else {
    fields=`<div class="field"><label>标题</label><input id="f-title" value="${attr(d.title)}" placeholder="给这条起个名"/></div>
      ${(m.moods&&m.moods.length)?`<div class="field"><label>分类标签</label><div class="seg" style="flex-wrap:wrap" id="f-mood">${m.moods.map(md=>`<div class="opt ${md===d.mood?'on':''}" data-v="${attr(md)}" style="flex:0 0 auto">${md}</div>`).join("")}</div></div>`:''}
      <div class="field"><label>内容</label><textarea id="f-content" placeholder="写点什么…">${esc(d.content||'')}</textarea></div>
      <div class="field"><label>日期</label><input id="f-date" type="date" value="${d.date||isoToday()}"/></div>`;
  }
  const layoutOpts=[{v:'default',l:'标准'},{v:'feature',l:'大图'},{v:'quote',l:'引文'}];
  fields=`<div class="field"><label>卡片样式</label><div class="seg" id="f-layout">${layoutOpts.map(o=>`<div class="opt ${o.v===(d.layout||'default')?'on':''}" data-v="${o.v}">${o.l}</div>`).join("")}</div></div>`+fields;
  (m.fields||[]).forEach(f=>{
    const v=d[f.key]||"";
    if(f.type==="select") fields+=`<div class="field"><label>${esc(f.label)}</label><div class="seg" style="flex-wrap:wrap" id="f-cf-${f.key}">${(f.options||[]).map(o=>`<div class="opt ${o===v?'on':''}" data-v="${attr(o)}" style="flex:0 0 auto">${esc(o)}</div>`).join("")}</div></div>`;
    else if(f.type==="textarea") fields+=`<div class="field"><label>${esc(f.label)}</label><textarea id="f-cf-${f.key}" placeholder="${attr(f.placeholder||'')}">${esc(v)}</textarea></div>`;
    else if(f.type==="number") fields+=`<div class="field"><label>${esc(f.label)}</label><input id="f-cf-${f.key}" type="number" value="${attr(v)}" placeholder="${attr(f.placeholder||'')}"/></div>`;
    else fields+=`<div class="field"><label>${esc(f.label)}</label><input id="f-cf-${f.key}" value="${attr(v)}" placeholder="${attr(f.placeholder||'')}"/></div>`;
  });
  fields+=`<div class="field"><label>图片 URL（可选）</label><input id="f-image" value="${attr(d.image||'')}" placeholder="https://..."/></div>`;
  const overlay=document.createElement("div"); overlay.className="overlay";
  overlay.innerHTML=`<div class="modal"><div class="grab"></div>
    <h2>${editing?'编辑':'新建'} · ${m.name}</h2><div class="sub">${m.desc}</div>
    ${fields}
    <div class="modal-actions">${editing?'<button class="link-danger" id="m-del">删除</button>':''}
      <button class="btn ghost" id="m-cancel">取消</button><button class="btn" id="m-save">保存</button></div></div>`;
  document.body.appendChild(overlay);
  const close=()=>overlay.remove();
  overlay.onclick=e=>{ if(e.target===overlay) close(); };
  overlay.querySelector("#m-cancel").onclick=close;
  overlay.querySelectorAll(".seg").forEach(seg=>seg.querySelectorAll(".opt").forEach(o=>o.onclick=()=>{
    seg.querySelectorAll(".opt").forEach(x=>x.classList.remove("on")); o.classList.add("on");
  }));
  if(editing) overlay.querySelector("#m-del").onclick=()=>{ close(); confirmDelete(key, d.id); };
  overlay.querySelector("#m-save").onclick=()=>{
    const val=id=>{ const el=overlay.querySelector(id); return el?el.value:undefined; };
    const seg=id=>{ const el=overlay.querySelector(id+" .on"); return el?el.dataset.v:undefined; };
    d.title=(val("#f-title")||"").trim()||"未命名";
    d.layout=seg("#f-layout")||'default';
    if(m.type==="todo"){ d.priority=seg("#f-prio")||d.priority; d.note=(val("#f-note")||"").trim(); }
    else if(m.type==="progress"){ d.current=Math.max(0,+val("#f-cur")||0); d.target=Math.max(1,+val("#f-tgt")||1); d.unit=(val("#f-unit")||"").trim(); d.note=(val("#f-note")||"").trim(); }
    else if(m.type==="note"){ d.mood=seg("#f-mood")||d.mood||""; d.content=(val("#f-content")||"").trim(); d.date=val("#f-date"); }
    (m.fields||[]).forEach(f=>{
      if(f.type==="select") d[f.key]=seg("#f-cf-"+f.key)||d[f.key]||"";
      else if(f.type==="number") d[f.key]=Math.max(0,+val("#f-cf-"+f.key)||0);

// ==================== RSS 资讯自动抓取 ====================
function rssToast(msg, type="info", duration=2600){
  let el = document.getElementById("rss-toast");
  if(!el){
    el = document.createElement("div");
    el.id = "rss-toast";
    Object.assign(el.style, {
      position:"fixed", left:"50%", bottom:"92px", transform:"translateX(-50%)",
      zIndex:"999", maxWidth:"86vw", padding:"10px 18px", borderRadius:"14px",
      fontSize:"13px", fontWeight:"600", boxShadow:"0 8px 28px rgba(0,0,0,.45)",
      border:"1px solid var(--border)", backdropFilter:"blur(10px)",
      transition:"opacity .25s, transform .25s", opacity:"0", pointerEvents:"none"
    });
    document.body.appendChild(el);
  }
  const colors = {
    info:  { bg:"var(--surface-card)",  fg:"var(--text)" },
    ok:    { bg:"rgba(90,143,123,.92)", fg:"#fff" },
    warn:  { bg:"rgba(201,169,106,.92)", fg:"#1a1d26" },
    error: { bg:"rgba(194,93,95,.92)",  fg:"#fff" },
  };
  const c = colors[type]||colors.info;
  el.style.background = c.bg;
  el.style.color = c.fg;
  el.textContent = msg;
  requestAnimationFrame(()=>{ el.style.opacity = "1"; el.style.transform = "translateX(-50%) translateY(-4px)"; });
  clearTimeout(el._t);
  el._t = setTimeout(()=>{
    el.style.opacity = "0"; el.style.transform = "translateX(-50%) translateY(0)";
  }, duration);
}

function classifyByKeywords(title, fallback){
  const t = String(title||"");
  const km = CONFIG.rss.keywordMap;
  for(const cat in km){
    const hit = km[cat].some(kw => t.includes(kw));
    if(hit) return cat;
  }
  return fallback || "视频创意";
}

function stripHtml(html, maxLen=180){
  const d = document.createElement("div");
  d.innerHTML = String(html||"");
  const txt = (d.textContent||d.innerText||"").replace(/\s+/g," ").trim();
  return txt.length > maxLen ? txt.slice(0,maxLen)+"…" : txt;
}

async function fetchRssByRss2Json(source){
  // 用 rss2json 公共代理把 RSS XML 转成 JSON（解决跨域）
  const url = CONFIG.rss.proxy(source.url);
  const resp = await fetch(url, { cache:"no-store" });
  if(!resp.ok) throw new Error(`HTTP ${resp.status}`);
  const json = await resp.json();
  if(json.status!=="ok" || !Array.isArray(json.items)) throw new Error(json.message||"RSS 解析失败");
  const maxN = CONFIG.rss.maxPerSource;
  return json.items.slice(0, maxN).map(it=>({
    title: stripHtml(it.title, 120),
    link: it.link || it.guid,
    summary: stripHtml(it.description || it.content || "", 200),
    pubDate: it.pubDate,
  }));
}

async function fetchHtmlPage(source){
  // 梦幻西游官网这种纯 HTML 页面，用 CORS 代理抓然后用 DOM 解析
  const url = CONFIG.rss.proxy2(source.url);
  const resp = await fetch(url, { cache:"no-store" });
  if(!resp.ok) throw new Error(`HTTP ${resp.status}`);
  const html = await resp.text();
  const d = document.createElement("div");
  d.innerHTML = html;
  const out = [];
  // 匹配梦幻西游官网新闻列表的结构
  const anchors = d.querySelectorAll("a[href*='163.com']");
  const seen = new Set();
  anchors.forEach(a=>{
    const title = stripHtml(a.textContent, 120);
    const href = a.getAttribute("href");
    if(!title || !href || title.length<8) return;
    const full = href.startsWith("http")?href : (new URL(href, source.url)).href;
    if(seen.has(full)) return; seen.add(full);
    // 过滤掉导航/广告链接，标题至少有意义
    if(/维护公告|开服公告|新服|攻略|新闻|更新|武神坛|活动|赛区/.test(title) || title.length>=12){
      out.push({ title, link: full, summary: title, pubDate: null });
      if(out.length >= CONFIG.rss.maxPerSource) return;
    }
  });
  return out;
}

async function fetchSingleSource(source){
  try{
    const items = source.htmlParse ? await fetchHtmlPage(source) : await fetchRssByRss2Json(source);
    return items.map(it=>({
      ...it,
      srcName: source.name,
      category: source.category || classifyByKeywords(it.title, "AI资讯"),
    }));
  }catch(err){
    console.warn(`[RSS] 抓取失败：${source.name}`, err);
    return [];
  }
}

async function fetchAllRssAndSave(manual=false){
  const existing = data.notes || [];
  const existTitles = new Set(existing.map(x=>x.title));
  rssToast(manual?"正在抓取最新资讯…":"早7点自动抓取中…", "info", 5000);
  const sources = CONFIG.rss.sources;
  let added = 0, failed = 0, duplicated = 0;
  const allNew = [];
  // 顺序抓取，避免一次并发太多被限流
  for(let i=0;i<sources.length;i++){
    const s = sources[i];
    const items = await fetchSingleSource(s);
    if(!items.length){ failed++; continue; }
    items.forEach(it=>{
      if(existTitles.has(it.title)){ duplicated++; return; }
      allNew.push({
        id: Date.now() + "_" + Math.random().toString(36).slice(2,7),
        title: it.title,
        content: (it.summary || it.title) +
          (it.link ? `\n\n🔗 原文链接：${it.link}` : ""),
        mood: it.category,
        date: isoToday(),
        source: it.srcName || it.category,
        importance: "普通",
        link: it.link,
        __fetched: true,
      });
      existTitles.add(it.title);
      added++;
    });
  }
  data.notes = allNew.concat(existing); // 新的放前面
  data.__rssMeta = data.__rssMeta || {};
  data.__rssMeta.lastFetchDate = isoToday();
  data.__rssMeta.lastFetchAt = Date.now();
  data.__rssMeta.lastAdded = added;
  data.__rssMeta.lastFailed = failed;
  data.__rssMeta.lastDup = duplicated;
  persist();
  const msg = added>0
    ? `抓取完成：新增 ${added} 条 · 重复 ${duplicated} 条 · 失败 ${failed} 个源`
    : `抓取完成：没有新内容（重复 ${duplicated} 条）`;
  rssToast(msg, added>0?"ok":"warn", 4200);
  if(added>0){ setTimeout(()=>{ go("notes"); }, 1100); }
}

function checkDailyAutoFetch(){
  const now = new Date();
  const hr = now.getHours();
  const targetHour = CONFIG.rss.autoFetchHour || 7;
  const meta = data.__rssMeta || {};
  // 1. 过了设定的小时  2. 今天还没抓过
  if(hr >= targetHour && meta.lastFetchDate !== isoToday()){
    // 延迟 3 秒再抓，先让页面渲染完
    setTimeout(()=>fetchAllRssAndSave(false), 3000);
  }
}

// ==================== 功能4：发布日历 ====================
function renderPublishCalendar(){
  const pubs = data.publish||[];
  const now=new Date(); const y=now.getFullYear(), m=now.getMonth();
  const startDow=new Date(y,m,1).getDay();
  const days=new Date(y,m+1,0).getDate();
  const todayIso=isoToday();
  // 检查打卡模块的发布打卡
  const checkins = data.checkin||[];
  const dyLog = checkins.find(x=>x.title&&x.title.includes("抖音"))?.log||{};
  const sphLog = checkins.find(x=>x.title&&x.title.includes("视频号"))?.log||{};
  // 发布记录的日期
  const pubDates = {};
  pubs.forEach(p=>{ const d=p.date; if(!d) return; if(!pubDates[d]) pubDates[d]={dy:0,sph:0}; if(p.platform==="抖音") pubDates[d].dy++; else pubDates[d].sph++; });
  // 断更检查
  let breakDays=0; const checkDate=new Date();
  for(let i=0;i<7;i++){ const key=checkDate.toISOString().slice(0,10);
    const hasPub=pubDates[key]&&(pubDates[key].dy||pubDates[key].sph);
    const hasChk=(dyLog[key]||sphLog[key]);
    if(!hasPub&&!hasChk){ if(key!==todayIso) breakDays++; } checkDate.setDate(checkDate.getDate()-1);
  }
  const breakWarn = breakDays>=2 ? `<div class="notif-banner warn">${icon("bell",16)} 已连续 ${breakDays} 天没发视频了，账号容易掉权重！<button id="go-publish">去记录</button></div>` : "";
  let cells="";
  for(let i=0;i<startDow;i++) cells+=`<div class="cal-cell blank"></div>`;
  for(let d=1;d<=days;d++){
    const ds=`${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const pub=pubDates[ds]; const dy=dyLog[ds], sph=sphLog[ds];
    let cls=""; if(pub&&pub.dy&&pub.sph||dy&&sph) cls="pub-both"; else if(pub&&pub.dy||dy) cls="pub-dy"; else if(pub&&pub.sph||sph) cls="pub-sph";
    cells+=`<div class="cal-cell ${cls} ${ds===todayIso?'today':''}">${d}</div>`;
  }
  $("#screen").innerHTML = `<div class="greet"><div><h1>发布日历</h1><p>${y}年${m+1}月 · 防断更</p></div></div>
    <div style="margin-top:16px">${breakWarn}
      <div class="panel cal-panel"><div class="cal-hd"><div class="cal-title">${y}年 ${m+1}月</div></div>
        <div class="cal-dow"><span>日</span><span>一</span><span>二</span><span>三</span><span>四</span><span>五</span><span>六</span></div>
        <div class="cal-grid">${cells}</div>
        <div class="cal-legend"><span><i style="background:rgba(194,93,95,.3)"></i>抖音</span><span><i style="background:rgba(95,122,168,.3)"></i>视频号</span><span><i style="background:rgba(201,169,106,.3)"></i>双平台</span></div>
      </div>
      <div class="sec-title">本月统计</div>
      <div class="panel"><div class="bar-list">
        <div class="bar-row"><span class="bar-name">抖音</span><span class="bar-pct">${
          Object.keys(dyLog).filter(k=>k.startsWith(`${y}-${String(m+1).padStart(2,'0')}`)).length
          +
          Object.keys(pubDates).filter(k=>k.startsWith(`${y}-${String(m+1).padStart(2,'0')}`)&&pubDates[k]?.dy).length
        } 天发布</span></div>
        <div class="bar-row"><span class="bar-name">视频号</span><span class="bar-pct">${
          Object.keys(sphLog).filter(k=>k.startsWith(`${y}-${String(m+1).padStart(2,'0')}`)).length
          +
          Object.keys(pubDates).filter(k=>k.startsWith(`${y}-${String(m+1).padStart(2,'0')}`)&&pubDates[k]?.sph).length
        } 天发布</span></div>
      </div></div></div>`;
  const gp=$("#go-publish"); if(gp) gp.onclick=()=>go("publish");
}

// ==================== 功能6：浏览器通知 ====================
let notifTimers=[];
function setupNotifications(){
  if(!("Notification" in window)) return;
  if(Notification.permission==="default"){ Notification.requestPermission(); }
  scheduleNotifications();
}
function scheduleNotifications(){
  notifTimers.forEach(t=>clearTimeout(t)); notifTimers=[];
  if(!("Notification" in window)||Notification.permission!=="granted") return;
  const now=new Date();
  CONFIG.notifications.schedule.forEach(s=>{
    const [h,mn]=s.time.split(":").map(Number);
    let target=new Date(now.getFullYear(),now.getMonth(),now.getDate(),h,mn,0,0);
    if(target<=now) target.setDate(target.getDate()+1);
    const delay=target-now;
    notifTimers.push(setTimeout(()=>{
      new Notification(s.title, {body:s.body, icon:"data:image/svg+xml,"+encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="%23c9a96a"><circle cx="12" cy="12" r="12"/></svg>')});
      scheduleNotifications(); // 递归排下一天的
    }, delay));
  });
}

function checkWeeklyReport(){

function generateWeeklyReport(){
  const now=new Date(); const weekAgo=new Date(now.getTime()-7*86400000);
  const waIso=weekAgo.toISOString().slice(0,10);
  // 统计
  const notes=(data.notes||[]).filter(x=>(x.date||"")>=waIso);
  const todos=(data.todo||[]).filter(x=>x.done);
  const pubs=(data.publish||[]).filter(x=>(x.date||"")>=waIso);
  const important=notes.filter(x=>x.importance==="必读"||x.importance==="重要").slice(0,10);
  const checkins=data.checkin||[];
  const totalChk=checkins.reduce((s,x)=>s+Object.keys(x.log||{}).filter(k=>k>=waIso).length,0);
  // 生成报告内容
  let content=`📊 本周创作复盘 (${weekAgo.toLocaleDateString()} ~ ${now.toLocaleDateString()})\n\n`;
  content+=`【完成任务】${todos.length} 项\n`;
  content+=`【发布视频】${pubs.length} 条（抖音${pubs.filter(x=>x.platform==='抖音').length} / 视频号${pubs.filter(x=>x.platform==='视频号').length}）\n`;
  content+=`【知识笔记】新增 ${notes.length} 条\n`;
  content+=`【打卡次数】共 ${totalChk} 次\n`;
  if(pubs.length){ const totalViews=pubs.reduce((s,x)=>s+(+x.views||0),0); const totalFoll=pubs.reduce((s,x)=>s+(+x.newFollowers||0),0);
    content+=`【视频数据】总播放 ${totalViews.toLocaleString()} · 新增粉丝 ${totalFoll}\n`; }
  if(important.length){ content+=`\n📌 本周重要素材 Top ${important.length}：\n`; important.forEach((n,i)=>content+=`${i+1}. ${n.title} (${n.mood})\n`); }
  content+=`\n💪 下周继续加油！`;
  // 存入笔记
  data.notes=data.notes||[];
  data.notes.unshift({id:Date.now(), title:`周报 ${isoToday()}`, content, mood:"视频创意", date:isoToday(), source:"自动生成", importance:"重要"});
  data.__weeklyMeta={lastDate:isoToday()};
  store.save();
  rssToast("本周周报已自动生成","ok",4000);
}

// ==================== 功能9：AI 写脚本 ====================
async function callAI(prompt, callback){
  if(!CONFIG.ai.apiKey) throw new Error("未配置 API Key");
  const resp = await fetch(CONFIG.ai.apiUrl, {
    method:"POST",
    headers:{ "Content-Type":"application/json", "Authorization":`Bearer ${CONFIG.ai.apiKey}` },
    body: JSON.stringify({
      model: CONFIG.ai.model,
      messages:[
        { role:"system", content:CONFIG.ai.systemPrompt },
        { role:"user", content:prompt }
      ],
      max_tokens: 1500,
      temperature: 0.7,
    })
  });
  if(!resp.ok) throw new Error(`API ${resp.status}`);
  const json = await resp.json();
  const text = json.choices?.[0]?.message?.content || "（AI 返回为空）";
  callback(text);
}

// ==================== 功能10：粉丝增长曲线 ====================
function renderFollowerView(){
  const platforms = CONFIG.followerTrack.platforms;
  data.followers=data.followers||{};
  // 确保每个平台有数据
  platforms.forEach(p=>{ if(!data.followers[p.key]) data.followers[p.key]=[]; });
  // 画SVG折线图
  const w=320,h=140,padX=10,padTop=14,padBot=20;
  const allVals=platforms.flatMap(p=>data.followers[p.key].map(x=>x.value));
  const maxV=Math.max(1,...allVals), minV=Math.min(0,...allVals);
  const rng=(maxV-minV)||1;
  const lines=platforms.map((p,idx)=>{
    const pts=data.followers[p.key]; if(pts.length<2) return "";
    const innerW=w-2*padX, innerH=h-padTop-padBot;
    const path=pts.map((pt,i)=>{
      const x=padX+innerW*i/Math.max(1,pts.length-1);
      const y=padTop+innerH*(1-(pt.value-minV)/rng);
      return (i?'L':'M')+x.toFixed(1)+' '+y.toFixed(1);
    }).join(' ');
    return `<path d="${path}" fill="none" stroke="${p.color}" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>`;
  }).join("");
  const chart=`<svg class="follower-chart" viewBox="0 0 ${w} ${h}">${lines}
    <text x="${padX}" y="${h-4}" font-size="9" fill="var(--text-tertiary)">${minV}</text>
    <text x="${w-padX-20}" y="${h-4}" font-size="9" fill="var(--text-tertiary)">${maxV}</text></svg>`;
  // 输入区
  const inputs=platforms.map(p=>{
    const last=data.followers[p.key].slice(-1)[0];
    return `<div class="follower-input">
      <select id="f-${p.key}-platform"><option>${p.name}</option></select>
      <input id="f-${p.key}-val" type="number" placeholder="当前粉丝数" value="${last?last.value:''}"/>
      <button data-pk="${p.key}" data-color="${p.color}">记录</button></div>`;
  }).join("");
  // 列表
  const recent=platforms.map(p=>{
    const pts=data.followers[p.key]||[];
    if(!pts.length) return "";
    const last=pts.slice(-1)[0];
    const first=pts[0];
    const growth=last.value-(first.value||0);
    return `<div class="bar-row"><span class="bar-ic" style="color:${p.color}">${icon("trending",16)}</span>
      <span class="bar-name">${p.name}</span><span class="bar-pct">${last.value} 粉 (±${growth>0?'+':''}${growth})</span></div>`;
  }).join("");
  $("#screen").innerHTML = `<div class="greet"><div><h1>粉丝曲线</h1><p>追踪粉丝增长趋势</p></div></div>
    <div style="margin-top:16px">
      <div class="sec-title">增长趋势</div>
      <div class="panel">${chart}</div>
      <div class="sec-title">记录今日粉丝</div>
      <div class="panel">${inputs}</div>
      <div class="sec-title">当前数据</div>
      <div class="panel"><div class="bar-list">${recent||'<div class="empty" style="padding:16px">还没有记录</div>'}</div></div>
    </div>`;
  document.querySelectorAll(".follower-input button").forEach(btn=>btn.onclick=()=>{
    const pk=btn.dataset.pk;
    const val=+$("#f-"+pk+"-val").value;
    if(!val&&val!==0){ rssToast("请输入粉丝数","warn"); return; }
    data.followers[pk]=data.followers[pk]||[];
    data.followers[pk].push({date:isoToday(),value:val});
    persist();
    rssToast(`${platforms.find(p=>p.key===pk).name} 粉丝数已记录`,"ok");
  });
}

// ==================== 功能11：番茄钟 ====================
let pomoState={running:false,mode:"work",remaining:25*60,sessions:0,timer:null};
function initPomodoro(){
  // 浮窗按钮
  const fab=document.createElement("button"); fab.className="pomo-fab"; fab.id="pomo-fab"; fab.innerHTML="🍅";
  const panel=document.createElement("div"); panel.className="pomo-panel"; panel.id="pomo-panel";
  document.body.appendChild(fab); document.body.appendChild(panel);
  fab.onclick=()=>{ panel.classList.toggle("show"); updatePomoDisplay(); };
  renderPomoPanel();
}
function renderPomoPanel(){
  const panel=$("#pomo-panel"); if(!panel) return;
  const workMin=CONFIG.pomodoro.workMin, breakMin=CONFIG.pomodoro.breakMin;
  panel.innerHTML=`<div class="pomo-time" id="pomo-time">25:00</div>
    <div class="pomo-label" id="pomo-label">专注工作时间</div>
    <div class="pomo-ctrls">
      <button class="primary" id="pomo-start">${icon("play",16)}开始</button>
      <button id="pomo-reset">${icon("refresh",16)}重置</button>
    </div>
    <div class="pomo-sess" id="pomo-sess">今日完成 0 个番茄钟</div>`;
  $("#pomo-start").onclick=togglePomo;
  $("#pomo-reset").onclick=resetPomo;
  updatePomoDisplay();
}
function togglePomo(){
  if(pomoState.running){ pausePomo(); }
  else{ startPomo(); }
}
function startPomo(){
  pomoState.running=true;
  pomoState.timer=setInterval(()=>{
    pomoState.remaining--;
    if(pomoState.remaining<=0){
      // 完成
      clearInterval(pomoState.timer); pomoState.running=false;
      if(pomoState.mode==="work"){
        pomoState.sessions++;
        data.__pomodoro=data.__pomodoro||{sessions:0,date:isoToday()};
        if(data.__pomodoro.date!==isoToday()){ data.__pomodoro={sessions:0,date:isoToday()}; }
        data.__pomodoro.sessions++; store.save();
        rssToast("专注完成！休息5分钟","ok",3000);
        pomoState.mode="break"; pomoState.remaining=CONFIG.pomodoro.breakMin*60;
      } else {
        rssToast("休息结束，开始下一个番茄钟","info",3000);
        pomoState.mode="work"; pomoState.remaining=CONFIG.pomodoro.workMin*60;
      }
      renderPomoPanel();
      $("#pomo-fab").classList.remove("running");
      // 通知
      if("Notification" in window && Notification.permission==="granted"){
        new Notification(pomoState.mode==="work"?"休息结束":"专注完成", {body: pomoState.mode==="work"?"开始下一个25分钟专注":"休息5分钟"});
      }
      updatePomoDisplay();
    } else { updatePomoDisplay(); }
  },1000);
  $("#pomo-fab").classList.add("running");
  renderPomoPanel();
}
function pausePomo(){
  pomoState.running=false;
  clearInterval(pomoState.timer);
  $("#pomo-fab").classList.remove("running");
  renderPomoPanel();
}
function resetPomo(){
  clearInterval(pomoState.timer); pomoState.running=false;
  pomoState.mode="work"; pomoState.remaining=CONFIG.pomodoro.workMin*60;
  $("#pomo-fab").classList.remove("running");
  renderPomoPanel();
}
function updatePomoDisplay(){
  const t=$("#pomo-time"); if(!t) return;
  const m=Math.floor(pomoState.remaining/60), s=pomoState.remaining%60;
  t.textContent=`${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
  const lbl=$("#pomo-label"); if(lbl) lbl.textContent=pomoState.mode==="work"?"专注工作时间":"休息时间";
  const fab=$("#pomo-fab"); if(fab) fab.textContent=pomoState.running?`${m}:${String(s).padStart(2,'0')}`:"🍅";
  const sess=$("#pomo-sess"); if(sess){
    const total=data.__pomodoro&&data.__pomodoro.date===isoToday()?data.__pomodoro.sessions:0;
    sess.textContent=`今日完成 ${total} 个番茄钟`;
  }
  const btn=$("#pomo-start"); if(btn) btn.innerHTML=pomoState.running?icon("pause",16)+"暂停":icon("play",16)+"开始";
}

buildDrawer();
render();
checkDailyAutoFetch();
setupNotifications();
checkWeeklyReport();
checkCreativeIdeas();
initPomodoro();
